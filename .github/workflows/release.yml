name: Build & Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Calendar version "YY.M.0" from the build date: advances monthly,
      # flips year automatically (26.10 -> 26.11 -> 27.1).
      # Injected into the exe via APP_VERSION (clap version), falling back
      # to Cargo.toml for local builds.
      - name: Compute calendar version
        shell: bash
        run: |
          ver="$(printf '%d.%d.0' "$((10#$(date +%y)))" "$((10#$(date +%m)))")"
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "CALVER=$ver" >> "$GITHUB_ENV"
          echo "calendar version: $ver"

      - name: Build GUI panel build (chatrans-gui.exe)
        run: cargo build --release -p chatrans --features gui --target-dir target/gui

      - name: Build console build (chatrans-console.exe)
        run: cargo build --release -p chatrans --target-dir target/console

      - name: Package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/', '' } else { "v$($env:CALVER)" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/gui/release/chatrans.exe dist/chatrans-gui.exe
          Copy-Item target/console/release/chatrans.exe dist/chatrans-console.exe
          Copy-Item README.md, LICENSE, README_EN.md dist/
          Compress-Archive -Path dist/* -DestinationPath "chatrans-$tag-windows-x64.zip"
          "ZIP=chatrans-$tag-windows-x64.zip" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatrans-windows-x64
          path: |
            dist/chatrans-gui.exe
            dist/chatrans-console.exe
            chatrans-*-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: chatrans-*-windows-x64.zip
