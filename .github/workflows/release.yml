name: Build & Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build GUI (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 版本号表示「适配的游戏版本」（如 26.11），不跟构建月份走。
      # 游戏版本是外部给定的，没法按日历自动推算，所以单一来源是：
      #   - 打了 tag（v26.11 或 v26.11.1）→ 以 tag 为准
      #   - 手动触发 → 读 chatrans/Cargo.toml 里 [package] 的 version
      # 提前适配下个版本（10 月发 26.11）是正常操作，不再做日历比对告警。
      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            src="tag $GITHUB_REF"
          else
            ver="$(awk '/^\[package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[^0-9.]/,"");print;exit}' chatrans/Cargo.toml)"
            src="chatrans/Cargo.toml"
          fi
          case "$ver" in
            *.*.*) ;;
            *) ver="$ver.0" ;;
          esac
          echo "APP_VERSION=v$ver" >> "$GITHUB_ENV"
          echo "PKGVER=$ver" >> "$GITHUB_ENV"
          echo "version: $ver (from $src)"

      - name: Build GUI panel (cargo build --release -p chatrans --features gui)
        run: cargo build --release -p chatrans --features gui

      - name: Package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') { $name = $env:GITHUB_REF -replace 'refs/tags/', '' } else { $name = "v$($env:PKGVER)" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/chatrans.exe dist/chatrans.exe
          Copy-Item README.md, LICENSE, README_EN.md dist/
          Compress-Archive -Path dist/* -DestinationPath "chatrans-$name-windows-x64.zip"
          "ZIP=chatrans-$name-windows-x64.zip" >> $env:GITHUB_ENV
          "PKGNAME=$name" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatrans-${{ env.PKGNAME }}-windows-x64
          path: chatrans-*-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: chatrans-*-windows-x64.zip
