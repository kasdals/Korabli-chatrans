name: Build & Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build GUI (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Version scheme: tag is the single source of truth (e.g. v26.10).
      # The tag (minus leading v) is injected into the exe as APP_VERSION.
      # Sanity check only: warn when the tag's YY.M differs from the build
      # date's calendar version (26.10 -> 26.11 -> 27.1 flips year automatically).
      # Manual runs (no tag) fall back to the build-date calendar version.
      - name: Resolve version from tag
        shell: bash
        run: |
          cal="$(printf '%d.%d.0' "$((10#$(date +%y)))" "$((10#$(date +%m)))")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            case "$ver" in
              *.*) ;;                     # already has a patch segment
              *) ver="$ver.0" ;;
            esac
            tagYYMM="$(printf '%d.%d' "$((10#$(echo "$ver" | cut -d. -f1)))" "$((10#$(echo "$ver" | cut -d. -f2)))")"
            if [ "$tagYYMM" != "${cal%.*}" ]; then
              echo "::warning::tag version $tagYYMM differs from build-date calendar version ${cal%.*} - tag wins"
            fi
          else
            ver="$cal"
          fi
          echo "APP_VERSION=v$ver" >> "$GITHUB_ENV"
          echo "PKGVER=$ver" >> "$GITHUB_ENV"
          echo "version: $ver"

      - name: Build GUI panel (cargo build --release -p chatrans --features gui)
        run: cargo build --release -p chatrans --features gui

      - name: Package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') { $name = $env:GITHUB_REF -replace 'refs/tags/', '' } else { $name = "v$($env:PKGVER)" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/chatrans.exe dist/chatrans.exe
          Copy-Item README.md, LICENSE, README_EN.md dist/
          Compress-Archive -Path dist/* -DestinationPath "chatrans-$name-windows-x64.zip"
          "ZIP=chatrans-$name-windows-x64.zip" >> $env:GITHUB_ENV
          "PKGNAME=$name" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatrans-${{ env.PKGNAME }}-windows-x64
          path: chatrans-*-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: chatrans-*-windows-x64.zip
