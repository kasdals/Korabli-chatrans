name: Build & Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build GUI panel build (chatrans-gui.exe)
        run: cargo build --release -p chatrans --features gui --target-dir target/gui

      - name: Build console build (chatrans-console.exe)
        run: cargo build --release -p chatrans --target-dir target/console

      - name: Package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/', '' } else { 'dev' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/gui/release/chatrans.exe dist/chatrans-gui.exe
          Copy-Item target/console/release/chatrans.exe dist/chatrans-console.exe
          Copy-Item README.md, LICENSE, README_EN.md dist/
          Compress-Archive -Path dist/* -DestinationPath "chatrans-$tag-windows-x64.zip"
          "ZIP=chatrans-$tag-windows-x64.zip" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatrans-windows-x64
          path: |
            dist/chatrans-gui.exe
            dist/chatrans-console.exe
            chatrans-*-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: chatrans-*-windows-x64.zip
